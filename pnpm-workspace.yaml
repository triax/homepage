# pnpm の設定（旧 .npmrc から移設）

# 公開直後のバージョンを取り込まないための待機時間（分単位）。
# 旧 .npmrc の min-release-age=7（日）と同じ「7 日」を意味する 10080 分を指定する。
minimumReleaseAge: 10080

# インストール時にビルドスクリプト（postinstall 等）の実行を許可する依存。
# pnpm 10 以降は既定でブロックされるため、明示しないと install が警告付きで失敗する。
# pnpm 11 のキーは allowBuilds（旧 onlyBuiltDependencies は解釈されない）。
allowBuilds:
  esbuild: true
