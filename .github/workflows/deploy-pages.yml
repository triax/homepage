name: Deploy to GitHub Pages

# docs/ をそのまま公開する legacy 配信をやめ、ビルドを挟める Actions 配信に切り替えている。
# ビルド時に hub の公開 API からメンバー情報を取得するため、生成物はリポジトリに含めない。
on:
  push:
    branches: [main]
  # Instagram 取得ワークフローの push は GITHUB_TOKEN 由来のため push イベントを発火しない。
  # 取得後のデータを確実に公開するため、完了を受けてデプロイする。
  workflow_run:
    workflows: ["Update Instagram Feed"]
    types: [completed]
  # 上記が動かなかった場合の保険。毎日 03:00 JST に hub の最新データを取り込む。
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、直列に流す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # workflow_run は失敗時にも発火するため、成功したときだけデプロイする
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # packageManager フィールドのバージョンで pnpm を用意する。
      # setup-node の cache: 'pnpm' より先に実行する必要がある。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 写真のリサイズに使う。ubuntu-latest には通常同梱されているが、無い場合に備える
      - name: Ensure ImageMagick
        run: |
          command -v magick || command -v convert || \
            (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Build members data from hub
        env:
          HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
        run: pnpm build:members

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
