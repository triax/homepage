name: Lint

# pnpm のインストール経路（pnpm/action-setup + --frozen-lockfile）と lint を
# Pull Request の時点で検証する。main への push は本番 Pages デプロイを起動するため、
# 依存解決の破綻をマージ前に捕まえられるのはこのワークフローだけ。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
